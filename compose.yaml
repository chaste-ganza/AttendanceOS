services:
  backend:
    # RFID reader is BYO / browser-side via the Web Serial API.
    # The browser on the teacher's computer opens the USB serial port directly;
    # the backend never owns a serial device. If you ever run the backend on the
    # host with the USB reader attached (not the normal deployment), uncomment the
    # devices line below and set DATABASE_PATH to a host path. Do not mix this with
    # the Web Serial flow — both try to hold the same port.
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      FLASK_DEBUG: "0"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-local-development-secret-change-me}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      DATABASE_PATH: /data/attendance.db
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-1}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      COMPOSE_PROJECT: attendanceos-podman
    volumes:
      - attendance_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./Frontend/AttendanceOs
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
    restart: unless-stopped

volumes:
  attendance_data:
